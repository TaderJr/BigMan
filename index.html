<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigMan's Roulo Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --teal:#2DFFD6;--teal2:#00E5C0;--teal3:#00C4A6;--cyan:#4DFFE8;
  --bg:#030f0d;--border:rgba(45,255,214,0.15);
  --text:#e8fff9;--muted:rgba(232,255,249,0.4);
  --gold:#FFD166;--silver:#C0C8D8;--bronze:#CD8B5A;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%,rgba(45,255,214,.13) 0%,transparent 65%),
    radial-gradient(ellipse 50% 40% at 100% 60%,rgba(0,229,192,.08) 0%,transparent 60%),
    radial-gradient(ellipse 40% 30% at 0% 80%,rgba(45,255,214,.06) 0%,transparent 60%);}
body::after{content:'';position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(45,255,214,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(45,255,214,.04) 1px,transparent 1px);
  background-size:44px 44px;}
canvas#ff{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* NAV */
.nav{position:fixed;top:20px;right:24px;z-index:100;display:flex;align-items:center;gap:10px;}
.btn-nav{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;
  border:1px solid var(--border);background:rgba(3,15,13,.8);backdrop-filter:blur(16px);
  color:var(--text);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
  text-decoration:none;cursor:pointer;white-space:nowrap;
  transition:border-color .2s,background .2s,box-shadow .2s;}
.btn-nav:hover{border-color:rgba(45,255,214,.5);background:rgba(45,255,214,.07);box-shadow:0 4px 22px rgba(45,255,214,.12);}
.btn-nav.kick{border-color:rgba(83,252,31,.25);color:#b0ffb8;}
.btn-nav.kick:hover{border-color:rgba(83,252,31,.55);background:rgba(83,252,31,.08);}
.btn-nav.roulo{border-color:rgba(45,255,214,.3);padding:8px 10px;}
.btn-nav.roulo:hover{border-color:rgba(45,255,214,.6);background:rgba(45,255,214,.09);}
.nav-logo{height:34px;width:auto;display:block;}

/* WRAP */
.wrap{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:100px 24px 80px;}

/* HERO */
.hero{text-align:center;margin-bottom:40px;}
.hero-eyebrow{font-size:11.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.hero-title{font-weight:900;font-size:clamp(22px,4vw,40px);line-height:1.1;letter-spacing:-.03em;
  display:flex;align-items:center;justify-content:center;gap:20px;}
.hero-title-text{white-space:nowrap;}
.grad{background:linear-gradient(90deg,var(--teal),var(--cyan));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 18px rgba(45,255,214,.5));}

/* COIN */
.spin-coin{width:56px;height:56px;object-fit:contain;flex-shrink:0;display:block;
  filter:drop-shadow(0 0 10px rgba(45,255,214,.7));
  animation:spin 2.5s linear infinite;}
.spin-coin.rev{animation-direction:reverse;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* PRIZES */
.prizes-strip{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:44px;}
.prize-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;
  border-radius:50px;border:1px solid rgba(45,255,214,.1);
  background:rgba(3,15,13,.65);backdrop-filter:blur(12px);font-size:12px;font-weight:700;}
.prize-pill .pr{color:var(--muted);font-weight:500;margin-right:2px;}
.pp1{border-color:rgba(255,209,102,.3);} .pp1 .amt{color:var(--gold);}
.pp2{border-color:rgba(192,200,216,.25);} .pp2 .amt{color:var(--silver);}
.pp3{border-color:rgba(205,139,90,.25);} .pp3 .amt{color:var(--bronze);}
.pp4{border-color:rgba(45,255,214,.25);} .pp4 .amt{color:var(--teal);}
.pp5,.pp6{border-color:rgba(0,196,166,.2);} .pp5 .amt,.pp6 .amt{color:var(--teal3);}

/* TIMER */
.timer-wrap{display:flex;justify-content:center;margin-bottom:48px;}
.timer{display:inline-flex;align-items:center;gap:4px;padding:14px 28px;
  border:1px solid rgba(45,255,214,.17);border-radius:20px;
  background:rgba(3,15,13,.8);backdrop-filter:blur(24px);
  box-shadow:0 4px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(45,255,214,.06);}
.timer-label{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(45,255,214,.4);margin-right:12px;padding-bottom:10px;align-self:center;}
.timer-seg{text-align:center;padding:0 8px;}
.timer-num{font-size:30px;font-weight:800;color:var(--text);line-height:1;
  min-width:42px;display:inline-block;text-align:center;letter-spacing:-.03em;}
.timer-unit{font-size:9px;font-weight:600;letter-spacing:.15em;color:rgba(45,255,214,.32);
  text-transform:uppercase;display:block;margin-top:5px;}
.timer-colon{font-size:24px;font-weight:200;color:rgba(45,255,214,.2);
  padding-bottom:10px;align-self:center;animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}

/* PODIUM */
.section-label{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);text-align:center;margin-bottom:30px;}
.podium-stage{display:flex;align-items:flex-end;justify-content:center;gap:10px;}
.p-col{display:flex;flex-direction:column;align-items:center;flex:1;max-width:230px;}
.p-info{display:flex;flex-direction:column;align-items:center;margin-bottom:14px;}
.p-crown{margin-bottom:10px;}
.p-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;margin-bottom:10px;border:2px solid transparent;
  width:48px;height:48px;font-size:17px;background:rgba(45,255,214,.08);border-color:rgba(45,255,214,.15);}
.p-col.p1 .p-avatar{background:linear-gradient(135deg,#073d33,#2DFFD6);border-color:rgba(45,255,214,.5);
  box-shadow:0 0 0 4px rgba(45,255,214,.1),0 0 28px rgba(45,255,214,.4);width:60px;height:60px;font-size:22px;}
.p-col.p2 .p-avatar{background:linear-gradient(135deg,#3d4a5e,#8090a8);border-color:rgba(192,200,216,.3);}
.p-col.p3 .p-avatar{background:linear-gradient(135deg,#6b3a1f,#c07040);border-color:rgba(205,139,90,.3);}
.p-name{font-size:14px;font-weight:600;color:var(--text);max-width:150px;text-align:center;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-bottom:4px;}
.p-name.empty{color:var(--muted);font-weight:400;}
.p-wager{font-size:13px;color:var(--muted);margin-bottom:6px;}
.p-wager.null-val{color:rgba(45,255,214,.25);font-style:italic;font-size:12px;}
.p-prize{font-size:15px;font-weight:700;}
.p-col.p1 .p-prize{color:var(--gold);text-shadow:0 0 12px rgba(255,209,102,.4);}
.p-col.p2 .p-prize{color:var(--silver);}
.p-col.p3 .p-prize{color:var(--bronze);}
.p-block{width:100%;border-radius:12px 12px 0 0;display:flex;align-items:center;
  justify-content:center;position:relative;overflow:hidden;}
.p-block::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;}
.p-col.p1 .p-block{height:130px;background:linear-gradient(180deg,rgba(45,255,214,.16) 0%,rgba(45,255,214,.04) 100%);
  border:1px solid rgba(45,255,214,.22);border-bottom:none;}
.p-col.p1 .p-block::after{background:linear-gradient(90deg,transparent,rgba(45,255,214,.65),transparent);}
.p-col.p2 .p-block{height:90px;background:linear-gradient(180deg,rgba(61,74,94,.3) 0%,rgba(61,74,94,.08) 100%);
  border:1px solid rgba(192,200,216,.16);border-bottom:none;}
.p-col.p2 .p-block::after{background:linear-gradient(90deg,transparent,rgba(192,200,216,.35),transparent);}
.p-col.p3 .p-block{height:64px;background:linear-gradient(180deg,rgba(107,58,31,.3) 0%,rgba(107,58,31,.08) 100%);
  border:1px solid rgba(205,139,90,.16);border-bottom:none;}
.p-col.p3 .p-block::after{background:linear-gradient(90deg,transparent,rgba(205,139,90,.35),transparent);}
.p-rank{font-weight:900;font-size:36px;opacity:.07;color:#fff;user-select:none;}
.podium-floor{height:2px;margin-bottom:40px;
  background:linear-gradient(90deg,transparent,rgba(45,255,214,.3),rgba(0,229,192,.4),rgba(45,255,214,.3),transparent);
  border-radius:2px;}

/* TABLE */
.lb-card{border:1px solid var(--border);border-radius:20px;overflow:hidden;
  background:rgba(3,15,13,.75);backdrop-filter:blur(24px);
  box-shadow:0 8px 48px rgba(0,0,0,.5),inset 0 1px 0 rgba(45,255,214,.05);}
.lb-head{display:grid;grid-template-columns:64px 1fr 160px 120px;padding:10px 22px;
  border-bottom:1px solid rgba(45,255,214,.09);background:rgba(45,255,214,.04);}
.lb-head span{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(45,255,214,.38);}
.lb-head span:nth-child(3),.lb-head span:nth-child(4){text-align:right;}
.lb-row{display:grid;grid-template-columns:64px 1fr 160px 120px;padding:11px 22px;
  align-items:center;border-bottom:1px solid rgba(45,255,214,.04);transition:background .2s;position:relative;}
.lb-row:last-child{border-bottom:none;}
.lb-row:hover{background:rgba(45,255,214,.04);}
.lb-row.r1{background:linear-gradient(90deg,rgba(45,255,214,.11) 0%,rgba(45,255,214,.03) 100%);border-bottom:1px solid rgba(45,255,214,.09);}
.lb-row.r1::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--teal),var(--teal3));border-radius:0 2px 2px 0;}
.lb-row.r2{background:linear-gradient(90deg,rgba(80,90,110,.12) 0%,rgba(80,90,110,.03) 100%);}
.lb-row.r2::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--silver);border-radius:0 2px 2px 0;opacity:.5;}
.lb-row.r3{background:linear-gradient(90deg,rgba(107,58,31,.12) 0%,rgba(107,58,31,.03) 100%);}
.lb-row.r3::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bronze);border-radius:0 2px 2px 0;opacity:.6;}
.lb-rank{font-size:15px;font-weight:800;color:rgba(45,255,214,.28);}
.lb-row.r1 .lb-rank{color:var(--teal);font-size:16px;}
.lb-row.r2 .lb-rank{color:var(--silver);opacity:.8;}
.lb-row.r3 .lb-rank{color:var(--bronze);opacity:.9;}
.lb-row.r4 .lb-rank{color:var(--teal);opacity:.55;}
.lb-row.r5 .lb-rank,.lb-row.r6 .lb-rank{color:var(--teal3);opacity:.5;}
.lb-user{display:flex;align-items:center;gap:14px;}
.lb-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#fff;flex-shrink:0;
  background:rgba(45,255,214,.08);border:1.5px solid rgba(45,255,214,.15);}
.lb-row.r1 .lb-av{background:linear-gradient(135deg,#073d33,#2DFFD6);border-color:rgba(45,255,214,.5);box-shadow:0 0 16px rgba(45,255,214,.28);}
.lb-row.r2 .lb-av{background:linear-gradient(135deg,#3d4a5e,#8090a8);border-color:rgba(192,200,216,.3);}
.lb-row.r3 .lb-av{background:linear-gradient(135deg,#6b3a1f,#c07040);border-color:rgba(205,139,90,.3);}
.lb-uname{font-size:14px;font-weight:500;color:var(--text);}
.lb-uname.empty{color:var(--muted);font-style:italic;}
.lb-row.r1 .lb-uname{color:#fff;}
.lb-wager{text-align:right;font-size:13px;color:var(--muted);}
.lb-wager.null-val{color:rgba(45,255,214,.22);font-style:italic;}
.lb-prize{text-align:right;font-size:14px;font-weight:700;color:rgba(45,255,214,.22);}
.lb-row.r1 .lb-prize{color:var(--gold);}
.lb-row.r2 .lb-prize{color:var(--silver);}
.lb-row.r3 .lb-prize{color:var(--bronze);}
.lb-row.r4 .lb-prize{color:var(--teal);}
.lb-row.r5 .lb-prize,.lb-row.r6 .lb-prize{color:var(--teal3);}

.refresh-badge{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;
  font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(45,255,214,.18);}
.refresh-dot{width:5px;height:5px;border-radius:50%;background:rgba(45,255,214,.3);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
.foot{text-align:center;margin-top:24px;font-size:11px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(232,255,249,.14);}

@media(max-width:600px){
  .lb-head,.lb-row{grid-template-columns:52px 1fr 110px;}
  .lb-head span:nth-child(3),.lb-wager{display:none;}
  .nav{top:14px;right:14px;gap:6px;}
  .btn-nav{padding:9px 14px;font-size:13px;}
  .wrap{padding-top:90px;}
  .spin-coin{width:38px;height:38px;}
  .hero-title{gap:12px;font-size:clamp(18px,5vw,28px);}
}
</style>
</head>
<body>
<canvas id="ff"></canvas>

<nav class="nav">
  <a href="https://kick.com/bigmantoughguy" target="_blank" class="btn-nav kick">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
      <path d="M3 3h4.5v7.2L11.5 3H17L11.5 10.5 17 18h-5.5L7.5 11.2V18H3V3Z" fill="#53fc1f"/>

    </svg>
    Kick
  </a>
  <a href="https://roulobets.com/?r=bigman" target="_blank" class="btn-nav roulo">
    <img class="nav-logo" src="image.png" alt="Roulo">
  </a>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="hero-eyebrow">Wager Race · Biweekly · Top 6 Win Cash</div>
    <h1 class="hero-title">
      <img class="spin-coin" src="spin.png" alt="">
      <span class="hero-title-text">BigMan's <span class="grad">$1,000</span> Roulo Leaderboard</span>
      <img class="spin-coin rev" src="spin.png" alt="">
    </h1>
  </div>

  <div class="prizes-strip">
    <div class="prize-pill pp1"><span class="pr">1st</span><span class="amt">$500</span></div>
    <div class="prize-pill pp2"><span class="pr">2nd</span><span class="amt">$250</span></div>
    <div class="prize-pill pp3"><span class="pr">3rd</span><span class="amt">$125</span></div>
    <div class="prize-pill pp4"><span class="pr">4th</span><span class="amt">$70</span></div>
    <div class="prize-pill pp5"><span class="pr">5th</span><span class="amt">$30</span></div>
    <div class="prize-pill pp6"><span class="pr">6th</span><span class="amt">$25</span></div>
  </div>

  <div class="timer-wrap">
    <div class="timer">
      <span class="timer-label" id="tlbl">Ends in</span>
      <div class="timer-seg"><span class="timer-num" id="td">00</span><span class="timer-unit">days</span></div>
      <div class="timer-colon">:</div>
      <div class="timer-seg"><span class="timer-num" id="th">00</span><span class="timer-unit">hrs</span></div>
      <div class="timer-colon">:</div>
      <div class="timer-seg"><span class="timer-num" id="tm">00</span><span class="timer-unit">min</span></div>
      <div class="timer-colon">:</div>
      <div class="timer-seg"><span class="timer-num" id="ts">00</span><span class="timer-unit">sec</span></div>
    </div>
  </div>

  <div style="margin-bottom:36px">
    <div class="section-label">Top 3</div>
    <div class="podium-stage" id="podium"></div>
    <div class="podium-floor"></div>
  </div>

  <div class="lb-card">
    <div class="lb-head">
      <span>Rank</span><span>Player</span>
      <span style="text-align:right">Wagered</span>
      <span style="text-align:right">Prize</span>
    </div>
    <div id="lb-body"></div>
  </div>

  <div class="refresh-badge"><div class="refresh-dot"></div><span>Live · Refreshes every 15 min</span></div>
  <div class="foot">Made with ❤ for BigMan</div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────
const API_KEY    = 'ev6i3k3tf625efelc6i4q47akx617p3e';
const START_DATE = '2026-03-19';   // API start_at param
const END_DATE   = '2026-04-01';   // API end_at param (biweekly = 2 weeks)
// Today is March 18 2026. Starts March 19 4pm EST, ends April 1 4pm EST.
const T_START = new Date('2026-03-19T16:00:00-05:00');
const T_END   = new Date('2026-04-01T16:00:00-05:00');
const PRIZES  = {1:500,2:250,3:125,4:70,5:30,6:25};
const REFRESH_MS = 15 * 60 * 1000;
// ─────────────────────────────────────────────────────────────────────

// FIREFLIES
const cv=document.getElementById('ff'),cx=cv.getContext('2d');
function rsz(){cv.width=innerWidth;cv.height=innerHeight;}
addEventListener('resize',rsz);rsz();
const flies=Array.from({length:45},()=>({
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
  r:Math.random()*1.7+.5,a:Math.random(),da:(Math.random()-.5)*.009,
  h:168+Math.random()*18
}));
(function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  flies.forEach(f=>{
    f.x+=f.vx;f.y+=f.vy;f.a+=f.da;
    if(f.a>1||f.a<0)f.da*=-1;
    if(f.x<0)f.x=cv.width;if(f.x>cv.width)f.x=0;
    if(f.y<0)f.y=cv.height;if(f.y>cv.height)f.y=0;
    cx.beginPath();cx.arc(f.x,f.y,f.r,0,Math.PI*2);
    cx.fillStyle=`hsla(${f.h},95%,64%,${f.a*.7})`;
    cx.shadowBlur=9;cx.shadowColor=`hsla(${f.h},95%,64%,.35)`;
    cx.fill();cx.shadowBlur=0;
  });
  requestAnimationFrame(loop);
})();

// TIMER — always counts down to END date (March 25 4pm EST)
function pad(n){return String(n).padStart(2,'0');}
function tick(){
  const ms=Math.max(0,T_END-Date.now());
  document.getElementById('tlbl').textContent='Ends in';
  document.getElementById('td').textContent=pad(Math.floor(ms/86400000));
  document.getElementById('th').textContent=pad(Math.floor(ms%86400000/3600000));
  document.getElementById('tm').textContent=pad(Math.floor(ms%3600000/60000));
  document.getElementById('ts').textContent=pad(Math.floor(ms%60000/1000));
}
tick();setInterval(tick,1000);

// HELPERS
function ini(n){return(n&&typeof n==='string')?n[0].toUpperCase():'?';}

function crown(type){
  const c={
    gold:  ['#FFD166','#F59E0B','rgba(255,209,102,.5)'],
    silver:['#C0C8D8','#94a3b8','rgba(192,200,216,.38)'],
    bronze:['#CD8B5A','#a16207','rgba(205,139,90,.42)']
  }[type];
  return`<svg width="34" height="26" viewBox="0 0 34 26" fill="none" style="display:block;filter:drop-shadow(0 0 5px ${c[2]})">
    <path d="M3 22L3 15L1 5.5L9 13L17 3L25 13L33 5.5L31 15L31 22Z" fill="${c[0]}" stroke="${c[1]}" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="3" y="22" width="28" height="3.5" rx="1.8" fill="${c[0]}" stroke="${c[1]}" stroke-width=".9"/>
    <circle cx="1"  cy="5.5" r="2.2" fill="${c[0]}" stroke="${c[1]}" stroke-width=".9"/>
    <circle cx="17" cy="3"   r="2.8" fill="${c[0]}" stroke="${c[1]}" stroke-width=".9"/>
    <circle cx="33" cy="5.5" r="2.2" fill="${c[0]}" stroke="${c[1]}" stroke-width=".9"/>
  </svg>`;
}

// Build podium — no fake data, show — when slot is empty
function buildPodium(players){
  const slots=[players[0]||null,players[1]||null,players[2]||null];
  const order=[{i:1,cls:'p2',ct:'silver',rank:2},{i:0,cls:'p1',ct:'gold',rank:1},{i:2,cls:'p3',ct:'bronze',rank:3}];
  return order.map(({i,cls,ct,rank})=>{
    const pl=slots[i];
    const name=pl?(pl.username||pl.name||'—'):'—';
    const hasData=pl&&(pl.wagered||pl.wager||pl.amount||pl.total_wagered);
    const wagerRaw=hasData?Number(pl.wagered||pl.wager||pl.amount||pl.total_wagered):null;
    const wagerStr=wagerRaw!=null?'$'+wagerRaw.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
    const prize=PRIZES[rank]?'$'+PRIZES[rank].toLocaleString():'';
    const av=name!=='—'?ini(name):rank;
    return`<div class="p-col ${cls}">
  <div class="p-info">
    <div class="p-crown">${crown(ct)}</div>
    <div class="p-avatar">${av}</div>
    <div class="p-name${name==='—'?' empty':''}">${name}</div>
    <div class="p-wager">${wagerStr}</div>
    ${prize?`<div class="p-prize">${prize}</div>`:''}
  </div>
  <div class="p-block"><span class="p-rank">${rank}</span></div>
</div>`;
  }).join('');
}

// Build rows — always exactly 10 rows, empty slots show — not fake data
function buildRows(players){
  const rowCls=['','r1','r2','r3','r4','r5','r6'];
  return Array.from({length:10},(_,i)=>{
    const p=players[i]||null;
    const rank=i+1;
    const name=p?(p.username||p.name||'—'):'—';
    const hasData=p&&(p.wagered||p.wager||p.amount||p.total_wagered);
    const wagerRaw=hasData?Number(p.wagered||p.wager||p.amount||p.total_wagered):null;
    const wagerStr=wagerRaw!=null?'$'+wagerRaw.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
    const pa=PRIZES[rank];
    const cls=rank<=6?rowCls[rank]:'';
    const av=name!=='—'?ini(name):rank;
    return`<div class="lb-row ${cls}">
  <div class="lb-rank">#${rank}</div>
  <div class="lb-user"><div class="lb-av">${av}</div><div class="lb-uname${name==='—'?' empty':''}">${name}</div></div>
  <div class="lb-wager${wagerRaw==null?' null-val':''}">${wagerStr}</div>
  <div class="lb-prize">${pa?'$'+pa.toLocaleString():'—'}</div>
</div>`;
  }).join('');
}

// Initial empty render — no fake data on load
document.getElementById('podium').innerHTML=buildPodium([]);
document.getElementById('lb-body').innerHTML=buildRows([]);

// API with cache — tries multiple CORS proxies on failure
let cache=[];
const PROXIES=[
  url=>url, // direct first
  url=>`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url=>`https://corsproxy.io/?${encodeURIComponent(url)}`,
  url=>`https://proxy.cors.sh/${url}`,
];
async function load(){
  try{
    const url=`https://api.roulobets.com/v1/external/affiliates?start_at=${START_DATE}&end_at=${END_DATE}&key=${API_KEY}`;
    let r=null;
    for(const proxy of PROXIES){
      try{
        r=await fetch(proxy(url),{signal:AbortSignal.timeout(8000)});
        if(r.ok)break;
        if(r.status===429){console.warn('[Roulo] Rate limited — using cache');return;}
      }catch(e){r=null;}
    }
    if(r&&r.ok){
      const d=await r.json();
      let arr=Array.isArray(d)?d:(d.data||d.leaderboard||d.players||d.results||d.entries||d.affiliates||[]);
      arr.sort((a,b)=>
        Number(b.wagered||b.wager||b.amount||b.total_wagered||0)-
        Number(a.wagered||a.wager||a.amount||a.total_wagered||0)
      );
      cache=arr;
    }else{
      console.warn('[Roulo] All proxies failed — using cache');
    }
  }catch(e){
    console.warn('[Roulo] Fetch error, using cache:',e);
  }
  document.getElementById('podium').innerHTML=buildPodium(cache);
  document.getElementById('lb-body').innerHTML=buildRows(cache);
}
load();
setInterval(load,REFRESH_MS);
</script>
